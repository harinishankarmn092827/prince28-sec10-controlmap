
[project]
name = "prince28-sec10-controlmap"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload"
lint = "ruff check ."
test = "python -m pytest tests/unit -v"
test-integration = "python -m pytest tests/integration -v"
cov = "python -m pytest tests/unit tests/integration --cov=app --cov=scripts --cov-report=term-missing --cov-report=html"
migrate = "alembic upgrade head"
seed = "python -m scripts.import_control_records"
