name: ControlMap CD

on:
  workflow_run:
    workflows: ["ControlMap CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy and Verify
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

      - name: Wait for expected commit to be deployed
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              https://prince28-sec10-controlmap.onrender.com/health \
              -o health.json; then

              if python -c '
          import json
          import os

          with open("health.json", encoding="utf-8") as file:
              data = json.load(file)

          expected = os.environ["EXPECTED_COMMIT"]
          deployed = data.get("commit")

          if data.get("status") != "healthy":
              raise SystemExit(f"API is not healthy: {data}")

          if not data.get("version"):
              raise SystemExit(f"API version is missing: {data}")

          if deployed != expected:
              raise SystemExit(
                  f"Waiting for expected commit {expected}; "
                  f"currently deployed: {deployed}"
              )

          print("Deployment verified:", data)
          '; then
                exit 0
              fi
            fi

            echo "Attempt $attempt: waiting for the expected deployment..."
            sleep 10
          done

          echo "Deployment verification failed."
          exit 1