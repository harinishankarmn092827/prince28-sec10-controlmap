name: ControlMap CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: controlmap
          POSTGRES_PASSWORD: controlmap123
          POSTGRES_DB: controlmap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controlmap -d controlmap_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://controlmap:controlmap123@localhost:5432/controlmap_test
      TEST_DATABASE_URL: postgresql+asyncpg://controlmap:controlmap123@localhost:5432/controlmap_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run python -m pytest

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Deployed API Smoke Test
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check deployed health endpoint
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = "https://prince28-sec10-controlmap.onrender.com/health"
          expected_commit = os.environ["EXPECTED_COMMIT"]

          for attempt in range(18):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "ControlMap-Smoke-Test"},
                  )

                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert response.status == 200, (
                          f"Unexpected HTTP status: {response.status}"
                      )
                      data = json.load(response)

                  assert data.get("status") == "healthy", data
                  assert data.get("version"), data

                  deployed_commit = data.get("commit")
                  assert deployed_commit, data

                  if deployed_commit != expected_commit:
                      raise RuntimeError(
                          f"Waiting for deployment. Expected {expected_commit}, "
                          f"but Render reports {deployed_commit}"
                      )

                  print("Smoke test passed:", data)
                  break

              except Exception as error:
                  if attempt == 17:
                      raise RuntimeError(
                          f"Smoke test failed after 18 attempts: {error}"
                      ) from error

                  print(
                      f"Attempt {attempt + 1} failed: {error}. "
                      "Retrying in 10 seconds..."
                  )
                  time.sleep(10)
          PY